<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Tastes of Africa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <nav>
      <a class="logo" href="index.html">Tastes of Africa</a>
      <a href="index.html">Home</a>
      <a href="recipes.html">Recipes</a>
      <a href="west-africa.html">West Africa</a>
      <a href="east-africa.html">East Africa</a>
      <a href="north-africa.html">North Africa</a>
      <a href="about.html">About</a>
      <a href="contact.html" class="active">Contact</a>
      <button id="theme-toggle" type="button">Dark mode</button>
    </nav>
  </header>
  <main>
    <h1>Contact Us</h1>
    <p>Have a question or a recipe to share? Send us a message.</p>
    <form id="contact-form" novalidate>
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required>
      <p id="name-error" class="error" role="alert"></p>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>
      <p id="email-error" class="error" role="alert"></p>

      <label for="country">Country</label>
      <input type="text" id="country" name="country" list="countries" placeholder="Start typing a country">
      <datalist id="countries">
          <option value="Rwanda">
          <option value="Nigeria">
          <option value="Ghana">
          <option value="Kenya">
          <option value="Ethiopia">
          <option value="Uganda">
          <option value="Tanzania">
          <option value="Senegal">
          <option value="Morocco">
          <option value="Egypt">
          <option value="South Africa">
          <option value="United States">
          <option value="United Kingdom">
      </datalist>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="6" required></textarea>
      <p id="message-error" class="error" role="alert"></p>

      <button type="submit">Send message</button>
    </form>
    <p id="confirmation" class="confirmation hidden" role="status"></p>
  </main>
  <footer>
    <p>Tastes of Africa. Celebrating African food heritage.</p>
    <form id="newsletter-form">
      <label for="newsletter-email">Get new recipes by email</label>
      <div class="inline">
        <input type="email" id="newsletter-email" name="email" placeholder="s.uwamahoro1@alustudent.com" required>
        <button type="submit">Subscribe</button>
      </div>
    </form>
  </footer>
  <script src="script.js"></script>
</body>
</html>
